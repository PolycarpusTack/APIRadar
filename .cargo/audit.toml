[advisories]
# RUSTSEC-2023-0071: Marvin Attack timing side-channel in rsa 0.9.x
# Pulled in transitively via sqlx-mysql (sqlx-macros-core includes all
# backends). We do not enable the MySQL feature and have no MySQL connection
# paths, so the RSA private-key operations affected by this advisory are
# never executed. No fixed version is available upstream.
ignore = ["RUSTSEC-2023-0071"]
