[package]
name = "drift-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "drift-api"
path = "src/main.rs"

[lib]
name = "drift_api"
path = "src/lib.rs"

[dependencies]
drift-core = { path = "../drift-core" }
