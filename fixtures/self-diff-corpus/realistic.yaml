openapi: "3.0.3"
info:
  title: Orders API (self-diff corpus)
  version: "2.4.0"
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, paid, shipped, cancelled]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated order list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  total:
                    type: integer
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CardPayment"
                - $ref: "#/components/schemas/BankTransfer"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "422":
          description: Validation error
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOrder
      responses:
        "200":
          description: One order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
components:
  schemas:
    Order:
      allOf:
        - $ref: "#/components/schemas/AuditFields"
        - type: object
          required: [id, amount, currency, status]
          properties:
            id:
              type: string
            amount:
              type: number
            currency:
              type: string
              pattern: "^[A-Z]{3}$"
            status:
              type: string
              enum: [pending, paid, shipped, cancelled]
            lines:
              type: array
              items:
                type: object
                properties:
                  sku:
                    type: string
                  quantity:
                    type: integer
            payer:
              $ref: "#/components/schemas/Payer"
    AuditFields:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    Payer:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
        manager:
          $ref: "#/components/schemas/Payer"
    CardPayment:
      type: object
      required: [card_number]
      properties:
        card_number:
          type: string
        save_card:
          type: boolean
    BankTransfer:
      type: object
      required: [iban]
      properties:
        iban:
          type: string
        reference:
          type: string
