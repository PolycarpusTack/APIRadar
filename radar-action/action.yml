name: 'Radar API Contract Drift Monitor'
description: 'Detect breaking API contract changes and block PRs based on blast radius evidence'
author: 'PolycarpusTack'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  base-spec:
    description: 'Path to the base (old) spec file — OpenAPI YAML/JSON, GraphQL SDL, or .proto'
    required: true
  head-spec:
    description: 'Path to the head (new) spec file'
    required: true
  service-id:
    description: 'Producer service ID in the Radar API registry (enables blast radius and policy decisions)'
    required: false
    default: ''
  radar-url:
    description: 'Base URL of the Radar API instance (e.g. https://radar.example.com)'
    required: false
    default: ''
  radar-token:
    description: 'Bearer token for authenticating with Radar API — use a GitHub secret'
    required: false
    default: ''
  fail-mode:
    description: >-
      closed | open | warn — Fail Mode for the check (controls how API errors
      and Breaking Changes map to the exit code). Applied only when the
      workspace has no .radar.yml; a workspace .radar.yml always wins and the
      input is then ignored with a warning.
    required: false
    default: 'closed'
  post-comment:
    description: 'true | false — post or update a PR comment with the drift summary and evidence table'
    required: false
    default: 'false'
  spec-format:
    description: 'openapi | graphql | protobuf — auto-detected from file extension when omitted'
    required: false
    default: ''

outputs:
  diff-id:
    description: 'ID of the diff record created in the Radar API (empty when radar-url is not set)'
    value: ${{ steps.check.outputs.diff-id }}
  breaking-count:
    description: 'Number of breaking changes detected'
    value: ${{ steps.check.outputs.breaking-count }}
  affected-consumer-count:
    description: 'Number of consumers affected by breaking changes (requires Radar API connection)'
    value: ${{ steps.check.outputs.affected-consumer-count }}
  policy-verdict:
    description: 'Policy verdict: pass | warn | block | overridden'
    value: ${{ steps.check.outputs.policy-verdict }}
  dashboard-url:
    description: 'URL to the Radar dashboard for this diff (empty when radar-url is not set)'
    value: ${{ steps.check.outputs.dashboard-url }}

runs:
  using: composite
  steps:
    # -------------------------------------------------------------------------
    # Step 1 — ensure Rust toolchain is available
    # -------------------------------------------------------------------------
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    # -------------------------------------------------------------------------
    # Step 2 — cache the Cargo registry and the radar-cli build output
    # -------------------------------------------------------------------------
    - name: Cache radar-cli build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ github.action_path }}/target/release/radar
          ${{ github.action_path }}/target/release/radar.exe
        # radar-cli is built from the surrounding workspace (the action dir has no
        # Cargo.lock), so hash the workspace lockfile. A glob returns "" instead of
        # erroring when absent, unlike a fixed non-existent path.
        key: ${{ runner.os }}-radar-cli-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-radar-cli-

    # -------------------------------------------------------------------------
    # Step 3 — build radar-cli from the action's own source tree
    # -------------------------------------------------------------------------
    - name: Build radar-cli
      shell: bash
      run: |
        # The cache step above may have restored the binary into the action
        # dir's target — check that path first, or the cache never short-circuits
        # anything (`command -v radar` is always false on a fresh runner).
        if [ -x "$GITHUB_ACTION_PATH/target/release/radar" ] || [ -x "$GITHUB_ACTION_PATH/target/release/radar.exe" ]; then
          echo "radar binary restored from cache — skipping build"
          echo "$GITHUB_ACTION_PATH/target/release" >> "$GITHUB_PATH"
        elif command -v radar &>/dev/null; then
          echo "radar already on PATH — skipping build"
        else
          echo "Building radar-cli from source…"
          cd "$GITHUB_ACTION_PATH"
          # Force the output into the action dir's target so it matches both the
          # PATH entry below and the cache paths. Without --target-dir, cargo
          # builds into the surrounding workspace target and `radar` is never
          # found on PATH (the check then silently falls back to breaking-count=0).
          cargo build --release -p radar-cli --target-dir "$GITHUB_ACTION_PATH/target" 2>&1
          echo "$GITHUB_ACTION_PATH/target/release" >> "$GITHUB_PATH"
        fi
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}

    # -------------------------------------------------------------------------
    # Step 4 — run radar check and capture outputs via summary file
    # -------------------------------------------------------------------------
    - name: Run radar check
      id: check
      shell: bash
      # All inputs reach the shell via env: + quoted "$VAR" — never inline
      # ${{ inputs.* }} interpolation — so fork-controlled values cannot inject
      # shell syntax, and paths with spaces survive (args is a bash array).
      run: |
        SUMMARY_FILE="${RUNNER_TEMP}/radar-summary-$GITHUB_RUN_ID.json"

        args=(check --base "$BASE_SPEC" --head "$HEAD_SPEC" --summary-file "$SUMMARY_FILE" --no-color)

        if [ -n "$SERVICE_ID" ]; then
          args+=(--service-id "$SERVICE_ID")
        fi
        if [ -n "$RADAR_URL" ]; then
          args+=(--api-url "$RADAR_URL")
        fi
        if [ -n "$SPEC_FORMAT" ]; then
          args+=(--format "$SPEC_FORMAT")
        fi
        if [ "$POST_COMMENT" = "true" ]; then
          args+=(--post-comment)
        fi

        # fail-mode wiring: radar check has no --fail-mode flag; it reads
        # fail_mode from a policy file (.radar.yml in cwd, or --policy PATH).
        # Precedence: a .radar.yml in the workspace always wins — the input is
        # only applied when the workspace has none, via a generated minimal
        # policy file in the runner temp dir (the workspace is never modified).
        # 'closed' is radar check's built-in default, so it needs no file.
        case "$FAIL_MODE" in
          closed|open|warn) ;;
          *)
            echo "::error::Invalid fail-mode '$FAIL_MODE' — expected closed | open | warn"
            exit 1
            ;;
        esac
        if [ -f .radar.yml ]; then
          if [ "$FAIL_MODE" != "closed" ]; then
            echo "::warning::.radar.yml found in the workspace — its fail_mode setting wins and the fail-mode input ('$FAIL_MODE') is ignored"
          fi
        elif [ "$FAIL_MODE" != "closed" ]; then
          POLICY_FILE="${RUNNER_TEMP}/radar-policy-$GITHUB_RUN_ID.yml"
          printf 'fail_mode: %s\n' "$FAIL_MODE" > "$POLICY_FILE"
          args+=(--policy "$POLICY_FILE")
        fi

        # Run; capture exit code without triggering set -e
        set +e
        radar "${args[@]}"
        EXIT_CODE=$?
        set -e

        # Parse summary file → GITHUB_OUTPUT
        if [ -f "$SUMMARY_FILE" ]; then
          echo "diff-id=$(jq -r '.diff_id // ""' "$SUMMARY_FILE")"           >> "$GITHUB_OUTPUT"
          echo "breaking-count=$(jq -r '.breaking_count // ""' "$SUMMARY_FILE")"   >> "$GITHUB_OUTPUT"
          echo "affected-consumer-count=$(jq -r '.affected_consumer_count // ""' "$SUMMARY_FILE")" >> "$GITHUB_OUTPUT"
          echo "policy-verdict=$(jq -r '.policy_verdict // ""' "$SUMMARY_FILE")"   >> "$GITHUB_OUTPUT"
          echo "dashboard-url=$(jq -r '.dashboard_url // ""' "$SUMMARY_FILE")" >> "$GITHUB_OUTPUT"
        else
          echo "diff-id="                  >> "$GITHUB_OUTPUT"
          echo "breaking-count=0"          >> "$GITHUB_OUTPUT"
          echo "affected-consumer-count=0" >> "$GITHUB_OUTPUT"
          echo "policy-verdict=pass"       >> "$GITHUB_OUTPUT"
          echo "dashboard-url="            >> "$GITHUB_OUTPUT"
        fi

        exit $EXIT_CODE
      env:
        BASE_SPEC: ${{ inputs.base-spec }}
        HEAD_SPEC: ${{ inputs.head-spec }}
        SERVICE_ID: ${{ inputs.service-id }}
        RADAR_URL: ${{ inputs.radar-url }}
        SPEC_FORMAT: ${{ inputs.spec-format }}
        POST_COMMENT: ${{ inputs.post-comment }}
        FAIL_MODE: ${{ inputs.fail-mode }}
        RADAR_API_URL: ${{ inputs.radar-url }}
        RADAR_SERVICE_TOKEN: ${{ inputs.radar-token }}
        GITHUB_TOKEN: ${{ github.token }}
