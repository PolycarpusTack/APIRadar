openapi: "3.0.3"
info:
  title: Radar Monitor API
  version: "0.2.0"
  description: |
    API Contract Radar Monitor — blast-radius-aware schema diff service.

    **Authentication**

    Two modes (configure on the server, not both at once):

    - **JWT mode** — set `RADAR_JWT_SECRET` on the server. Clients must pass an HS256 JWT
      with `sub` and `org_id` claims in `Authorization: Bearer <token>`.
      The `org_id` claim scopes all service/consumer reads and writes to that organisation.

    - **Service-token mode** — set `RADAR_SERVICE_TOKEN` on the server. Clients must pass
      `Authorization: Bearer <token>` where the token matches exactly.

    When neither env var is set, authentication is **optional** (dev mode).
    Set `RADAR_REQUIRE_AUTH=true` to force rejection of unauthenticated requests
    even without a token configured.

    `GET /metrics` exposes Prometheus text exposition format for internal
    scraping (not intended for external API consumers).
  contact:
    name: Radar Monitor
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development (Vite proxy or direct)
  - url: http://localhost:8080/app
    description: Docker / web self-host (UI served from /app)

tags:
  - name: health
  - name: services
  - name: consumers
  - name: diffs
  - name: blast-radius
  - name: usage
  - name: scan
  - name: release-notes
  - name: generate-tests
  - name: playground
  - name: settings
  - name: spec-versions
  - name: webhooks
  - name: scheduled-scans
  - name: notifications
  - name: csv-runs
  - name: audit-events
  - name: acknowledgements
  - name: policy-decisions
  - name: catalog-sources
  - name: evolution-rules
  - name: evidence
  - name: readiness
  - name: scalar
  - name: auth
  - name: share

paths:
  /health:
    get:
      tags: [health]
      summary: Health check — probes DB connectivity
      operationId: health
      security: []
      responses:
        "200":
          description: Service is healthy and DB is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is degraded (DB unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      tags: [health]
      summary: Prometheus metrics (text exposition format)
      description: |
        Prometheus text exposition format, for internal scraping.
        Open by default; when `RADAR_METRICS_TOKEN` is set the endpoint
        requires a matching `Authorization: Bearer <token>` header.
      operationId: metrics
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid bearer token (when RADAR_METRICS_TOKEN is set)

  /v1/services:
    get:
      tags: [services]
      summary: List all producer services
      operationId: listServices
      description: |
        When authenticated with a JWT, only services whose `org_id` matches
        the caller's JWT `org_id` claim are returned. Without a JWT all
        services are listed.
      responses:
        "200":
          description: Array of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      tags: [services]
      summary: Register a producer service
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "422":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/services/{serviceId}:
    parameters:
      - $ref: "#/components/parameters/serviceId"
    get:
      tags: [services]
      summary: Get a producer service by ID
      operationId: getService
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services/{serviceId}/diffs:
    parameters:
      - $ref: "#/components/parameters/serviceId"
    get:
      tags: [diffs]
      summary: List diffs for a service
      operationId: listDiffs
      responses:
        "200":
          description: Array of diffs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiffSummary"
    post:
      tags: [diffs]
      summary: Create a new diff (post spec changes from CI)
      operationId: createDiff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiffRequest"
      responses:
        "201":
          description: Diff created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"

  /v1/services/{serviceId}/consumers:
    parameters:
      - $ref: "#/components/parameters/serviceId"
    get:
      tags: [consumers]
      summary: List consumers subscribed to a service
      operationId: listServiceConsumers
      responses:
        "200":
          description: Array of consumers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consumer"

  /v1/services/{serviceId}/subscriptions:
    parameters:
      - $ref: "#/components/parameters/serviceId"
    post:
      tags: [consumers]
      summary: Subscribe a consumer to a service
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumer_id]
              properties:
                consumer_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string

  /v1/consumers:
    get:
      tags: [consumers]
      summary: List all consumers
      operationId: listAllConsumers
      description: |
        When authenticated with a JWT, only consumers whose `org_id` matches
        the caller's JWT `org_id` claim are returned.
      responses:
        "200":
          description: Array of consumers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consumer"
    post:
      tags: [consumers]
      summary: Register a new consumer
      operationId: createConsumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsumerRequest"
      responses:
        "201":
          description: Consumer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/diffs:
    get:
      tags: [diffs]
      summary: List all diffs across all services (newest 100)
      operationId: listAllDiffs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Array of diffs with change counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiffSummary"

  /v1/diffs/{diffId}:
    parameters:
      - $ref: "#/components/parameters/diffId"
    get:
      tags: [diffs]
      summary: Get a diff with its changes
      operationId: getDiff
      responses:
        "200":
          description: Diff detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/diffs/{diffId}/blast-radius:
    parameters:
      - $ref: "#/components/parameters/diffId"
    get:
      tags: [blast-radius]
      summary: Get blast radius (affected consumers) for a diff
      description: |
        Returns one entry per subscribed consumer that has evidence of using
        any field touched by a breaking change in this diff.

        Confidence levels:
        - **high** — runtime usage event within the last 7 days
        - **medium** — runtime usage event within the last 30 days
        - **low** — call-site from static scan only (no runtime event)
      operationId: getBlastRadius
      responses:
        "200":
          description: Blast radius report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadius"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/diffs/{diffId}/release-notes:
    parameters:
      - $ref: "#/components/parameters/diffId"
    post:
      tags: [release-notes]
      summary: Store AI-generated release notes for a diff
      operationId: createReleaseNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Markdown release notes content
      responses:
        "201":
          description: Release note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNote"

  /v1/diffs/{diffId}/release-notes/generate:
    parameters:
      - $ref: "#/components/parameters/diffId"
    post:
      tags: [release-notes]
      summary: Queue AI generation of release notes for a diff
      description: |
        Creates a release-note record in `pending` state and starts a
        background task that generates the Markdown content. Returns
        immediately; poll `GET /v1/release-notes/{id}/generate-status`
        to observe progress (`pending` → `completed` | `failed`).
      operationId: generateReleaseNote
      responses:
        "201":
          description: Generation queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  diff_id:
                    type: string
                  status:
                    type: string
                    example: draft
                  generation_status:
                    type: string
                    enum: [pending, completed, failed]
                  created_at:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/release-notes:
    get:
      tags: [release-notes]
      summary: List all stored release notes
      operationId: listReleaseNotes
      responses:
        "200":
          description: Array of release note rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseNoteRow"

  /v1/release-notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [release-notes]
      summary: Get a release note with full markdown content
      operationId: getReleaseNote
      responses:
        "200":
          description: Release note detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNote"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/spec-versions:
    get:
      tags: [spec-versions]
      summary: List all stored spec versions
      operationId: listSpecVersions
      responses:
        "200":
          description: Array of spec version summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpecVersionSummary"

  /v1/spec-versions/{id}/raw:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [spec-versions]
      summary: Get the raw spec YAML for a stored spec version
      operationId: getSpecVersionRaw
      responses:
        "200":
          description: Raw YAML content
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/generate-tests:
    get:
      tags: [generate-tests]
      summary: List previously generated test suites
      operationId: listTestSuites
      responses:
        "200":
          description: Array of test suite summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestSuiteSummary"
    post:
      tags: [generate-tests]
      summary: Generate a Postman Collection and api-testing YAML from a Jira ticket + spec
      operationId: generateTests
      description: |
        Uses the configured AI provider (ANTHROPIC_API_KEY, OPENAI_API_KEY, or
        GITHUB_COPILOT_TOKEN) to generate test cases from a Jira ticket description
        and an OpenAPI spec. Either `jira_key` (fetched from Jira) or
        `jira_summary` + `jira_description` must be provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTestsRequest"
      responses:
        "201":
          description: Test suite generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSuiteDetail"
        "422":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: No AI provider configured

  /v1/generate-tests/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [generate-tests]
      summary: Get a generated test suite with full collection JSON and api-testing YAML
      operationId: getTestSuite
      responses:
        "200":
          description: Test suite detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestSuiteDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sandbox-envs:
    get:
      tags: [playground]
      summary: List shared sandbox environments for the API Playground
      operationId: listSandboxEnvs
      description: Bearer tokens are masked in the response — only the last 4 characters are shown.
      responses:
        "200":
          description: Array of sandbox environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxEnv"
    post:
      tags: [playground]
      summary: Create a sandbox environment
      operationId: createSandboxEnv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxEnvRequest"
      responses:
        "201":
          description: Sandbox environment created (bearer_token is masked in response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEnv"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/sandbox-envs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [playground]
      summary: Update a sandbox environment
      operationId: updateSandboxEnv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSandboxEnvRequest"
      responses:
        "200":
          description: Sandbox environment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxEnv"
        "422":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [playground]
      summary: Delete a sandbox environment
      operationId: deleteSandboxEnv
      responses:
        "204":
          description: Deleted

  /v1/settings:
    get:
      tags: [settings]
      summary: Get application settings
      operationId: getSettings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
    put:
      tags: [settings]
      summary: Update application settings
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSettings"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/settings/integrations:
    get:
      tags: [settings]
      summary: Get integration status (read-only, reflects server env vars)
      operationId: getIntegrations
      responses:
        "200":
          description: Integration configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"

  /v1/usage/events:
    post:
      tags: [usage]
      summary: Ingest runtime usage events from consumers
      operationId: ingestUsageEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                $ref: "#/components/schemas/UsageEvent"
      responses:
        "202":
          description: Events accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer

  /v1/call-sites:
    post:
      tags: [scan]
      summary: Upsert static call-site records from the radar-scanner
      operationId: upsertCallSites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 5000
              items:
                $ref: "#/components/schemas/CallSite"
      responses:
        "202":
          description: Call sites accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: integer

  /v1/summary:
    get:
      tags: [services]
      summary: Get dashboard KPI summary
      operationId: getSummary
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"

  # ---------------------------------------------------------------------------
  # EPIC K: Webhooks
  # ---------------------------------------------------------------------------

  /v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks for the authenticated organisation
      operationId: listWebhooks
      responses:
        "200":
          description: Array of webhook configurations (secrets masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      tags: [webhooks]
      summary: Register a new webhook endpoint
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
      responses:
        "201":
          description: Webhook created — full secret returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/webhooks/{webhookId}:
    delete:
      tags: [webhooks]
      summary: Delete a webhook
      operationId: deleteWebhook
      parameters:
        - $ref: "#/components/parameters/webhookId"
      responses:
        "204":
          description: Webhook deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/webhooks/{webhookId}/test:
    post:
      tags: [webhooks]
      summary: Send a test ping delivery to the webhook
      operationId: testWebhook
      parameters:
        - $ref: "#/components/parameters/webhookId"
      responses:
        "202":
          description: Test delivery queued
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/webhooks/{webhookId}/deliveries:
    get:
      tags: [webhooks]
      summary: List the last 50 delivery attempts for a webhook
      operationId: listWebhookDeliveries
      parameters:
        - $ref: "#/components/parameters/webhookId"
      responses:
        "200":
          description: Array of delivery records (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDelivery"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------
  # EPIC K: Scheduled Scans
  # ---------------------------------------------------------------------------

  /v1/scheduled-scans:
    get:
      tags: [scheduled-scans]
      summary: List scheduled spec-polling scans
      operationId: listScheduledScans
      responses:
        "200":
          description: Array of scheduled scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledScan"
    post:
      tags: [scheduled-scans]
      summary: Register or update a scheduled spec-polling scan
      operationId: createScheduledScan
      description: |
        Idempotent on `(org_id, service_id, spec_url)`. Re-posting the same
        combination updates `interval_minutes` and re-activates the scan.
        `spec_url` must be a publicly reachable HTTPS URL — private IP ranges
        are rejected (SSRF protection). Minimum `interval_minutes` is 15.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScanRequest"
      responses:
        "200":
          description: Scan updated (existing record)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledScan"
        "201":
          description: Scan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledScan"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/scheduled-scans/{scanId}:
    delete:
      tags: [scheduled-scans]
      summary: Delete a scheduled scan
      operationId: deleteScheduledScan
      parameters:
        - $ref: "#/components/parameters/scanId"
      responses:
        "204":
          description: Scan deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/scheduled-scans/history:
    get:
      tags: [scheduled-scans]
      summary: List the most recent scan execution runs (newest first)
      operationId: listScanRunHistory
      responses:
        "200":
          description: Array of scan run records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanRun"

  # ---------------------------------------------------------------------------
  # EPIC K: Notifications
  # ---------------------------------------------------------------------------

  /v1/notifications/digest/preview:
    post:
      tags: [notifications]
      summary: Preview the weekly email digest as HTML
      operationId: previewDigest
      description: Returns the rendered HTML that would be emailed for the current 7-day window.
      responses:
        "200":
          description: HTML digest document
          content:
            text/html:
              schema:
                type: string

  /v1/services/{serviceId}/diffs/compare:
    parameters:
      - $ref: "#/components/parameters/serviceId"
    post:
      tags: [diffs]
      summary: Compare two spec bodies without posting from CI
      operationId: compareSpecs
      description: |
        Accepts base and head spec bodies directly (not git refs). Creates a diff row and
        returns it. Useful for the in-browser "Compare Specs" panel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareSpecsRequest"
      responses:
        "200":
          description: Diff created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/compare/batch:
    post:
      tags: [diffs]
      summary: Compare multiple spec pairs listed by URL
      operationId: batchCompare
      description: |
        Each entry provides a base URL and head URL pointing to spec files to fetch and
        compare. Results are returned in the same order as the input. This is the API-side
        counterpart to `radar batch --csv`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BatchCompareItem"
      responses:
        "200":
          description: Array of result summaries, one per input item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchResultItem"

  /v1/consumers/upsert:
    post:
      tags: [consumers]
      summary: Register or update a consumer by name (idempotent)
      operationId: upsertConsumer
      description: |
        Creates the consumer if it does not exist; updates `owner_team` and `contact` if it does.
        Idempotent on `(org_id, name)`. Used by the collection-file scanner so it can register
        consumers without knowing their UUID in advance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertConsumerRequest"
      responses:
        "200":
          description: Consumer row (created or updated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumer"

  /v1/evidence/collection:
    post:
      tags: [evidence]
      summary: Ingest collection evidence items (call sites from a Postman or OpenAPI scan)
      operationId: ingestCollectionEvidence
      description: |
        Accepts an array of evidence items. Each item records a (consumer, service, operation,
        field_path) tuple. Idempotent — re-posting the same items produces the same rows
        (deterministic IDs based on the tuple).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CollectionEvidenceItem"
      responses:
        "200":
          description: Number of evidence entries written
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer

  /v1/evidence/coverage:
    get:
      tags: [evidence]
      summary: Evidence coverage across all services and consumers
      operationId: getEvidenceCoverage
      description: |
        Returns per-service operation coverage statistics: what fraction of known operations
        have at least one piece of evidence attached (runtime usage, call site, or collection file).
      responses:
        "200":
          description: Coverage data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvidenceCoverageEntry"

  /v1/services/{serviceId}/sampling:
    parameters:
      - $ref: "#/components/parameters/serviceId"
    get:
      tags: [evidence]
      summary: Get sampling configuration for a service
      operationId: getSampling
      responses:
        "200":
          description: Sampling configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingConfig"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [evidence]
      summary: Update sampling configuration for a service
      operationId: putSampling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SamplingConfig"
      responses:
        "200":
          description: Updated sampling configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SamplingConfig"

  /v1/otlp/v1/traces:
    post:
      tags: [usage]
      summary: Ingest OpenTelemetry trace spans as usage events
      operationId: ingestOtlpTraces
      description: |
        Accepts an OTLP JSON trace payload. Radar extracts HTTP span attributes
        (`http.method`, `http.route`, `http.target`) and maps them to usage events.
        Compatible with OpenTelemetry Collector HTTP exporter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: OTLP ExportTraceServiceRequest JSON
      responses:
        "200":
          description: Ingested

  /v1/gateway/logs:
    post:
      tags: [usage]
      summary: Ingest API gateway access logs as usage events
      operationId: ingestGatewayLogs
      description: |
        Accepts an array of structured gateway log entries. Radar maps each entry to a
        usage event. Compatible with Kong, AWS API Gateway, and Nginx access log formats.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                description: Gateway log entry (format auto-detected)
      responses:
        "200":
          description: Ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested:
                    type: integer

  /v1/policy-decisions:
    get:
      tags: [policy-decisions]
      summary: List policy decisions
      operationId: listPolicyDecisions
      parameters:
        - name: service_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated policy decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionListResponse"
    post:
      tags: [policy-decisions]
      summary: Record a policy decision from the CLI
      operationId: createPolicyDecision
      description: |
        Called by `radar check` after evaluating a diff against the policy. Records the outcome
        (pass/fail/warn), the number of breaking changes, whether the blast radius was active,
        and whether an override label was present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyDecisionRequest"
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecision"

  /v1/acknowledgements:
    get:
      tags: [acknowledgements]
      summary: List acknowledgements
      operationId: listAcknowledgements
      parameters:
        - name: diff_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Array of acknowledgements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Acknowledgement"
    post:
      tags: [acknowledgements]
      summary: Acknowledge a diff (sign-off by a reviewer)
      operationId: createAcknowledgement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcknowledgementRequest"
      responses:
        "201":
          description: Acknowledgement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acknowledgement"

  /v1/diffs/{diffId}/acknowledgements:
    parameters:
      - $ref: "#/components/parameters/diffId"
    get:
      tags: [acknowledgements]
      summary: List acknowledgements for a specific diff
      operationId: listDiffAcknowledgements
      responses:
        "200":
          description: Array of acknowledgements for the diff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Acknowledgement"

  /v1/catalog-sources:
    get:
      tags: [catalog-sources]
      summary: List catalog sources
      operationId: listCatalogSources
      responses:
        "200":
          description: Array of catalog sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogSource"
    post:
      tags: [catalog-sources]
      summary: Register a catalog source
      operationId: createCatalogSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogSourceRequest"
      responses:
        "201":
          description: Catalog source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSource"

  /v1/catalog-sources/{catalogSourceId}/sync:
    parameters:
      - name: catalogSourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [catalog-sources]
      summary: Trigger a manual sync of a catalog source
      operationId: syncCatalogSource
      description: |
        Fetches the catalog endpoint, imports new services, and updates existing ones.
        Returns the number of services upserted.
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  upserted:
                    type: integer

  /v1/evolution-rules:
    get:
      tags: [evolution-rules]
      summary: List evolution rules
      operationId: listEvolutionRules
      responses:
        "200":
          description: Wrapped array of evolution rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvolutionRule"
    post:
      tags: [evolution-rules]
      summary: Create an evolution rule
      operationId: createEvolutionRule
      description: |
        Allow-lists a specific change kind (and optionally a field path) for a service so that
        `radar check` does not block CI for that change. Rules expire automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEvolutionRuleRequest"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionRule"

  /v1/evolution-rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [evolution-rules]
      summary: Delete an evolution rule
      operationId: deleteEvolutionRule
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [evolution-rules]
      summary: Toggle an evolution rule (enable or disable)
      operationId: toggleEvolutionRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionRule"

  /v1/csv-runs:
    get:
      tags: [csv-runs]
      summary: List CSV runner jobs
      operationId: listCsvRuns
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Array of CSV runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CsvRun"
    post:
      tags: [csv-runs]
      summary: Start a new CSV runner job
      operationId: createCsvRun
      description: |
        Accepts a CSV body and a request template. Rows are dispatched asynchronously.
        The response contains the job ID; poll `GET /v1/csv-runs/{id}` for status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCsvRunRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvRun"
        "422":
          description: Invalid run config, or SSRF protection rejected the target URL

  /v1/csv-runs/{csvRunId}:
    parameters:
      - name: csvRunId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [csv-runs]
      summary: Get a CSV runner job by ID
      operationId: getCsvRun
      responses:
        "200":
          description: CSV run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvRun"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [csv-runs]
      summary: Cancel a CSV runner job
      operationId: cancelCsvRun
      description: |
        Cancels a pending or running job. Returns 404 if the job is already completed or does
        not exist.
      responses:
        "204":
          description: Cancelled
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/csv-runs/{csvRunId}/results:
    parameters:
      - name: csvRunId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [csv-runs]
      summary: Get per-row results for a CSV runner job
      operationId: getCsvRunResults
      responses:
        "200":
          description: Array of row results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CsvRunResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/audit-events:
    get:
      tags: [audit-events]
      summary: List audit events
      operationId: listAuditEvents
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: action
          in: query
          description: Filter by exact action string (e.g. "diff.created")
          schema:
            type: string
        - name: entity_type
          in: query
          description: Filter by entity type (e.g. "diff", "consumer")
          schema:
            type: string
      responses:
        "200":
          description: Array of audit events (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
    post:
      tags: [audit-events]
      summary: Write a custom audit event
      operationId: createAuditEvent
      description: |
        Allows external systems (e.g. the CLI, CI pipeline) to write arbitrary audit events
        into the trail. Secrets in `meta` are automatically redacted before storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAuditEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"

  /v1/readiness:
    get:
      tags: [readiness]
      summary: Product readiness summary
      operationId: getReadiness
      description: |
        Returns a checklist of readiness items: whether at least one service is registered,
        at least one consumer is registered, at least one diff has been run, and whether the
        AI provider is configured. Shown on the Overview page to guide first-time setup.
      security: []
      responses:
        "200":
          description: Readiness checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /v1/release-notes/{releaseNoteId}/generate-status:
    parameters:
      - name: releaseNoteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [release-notes]
      summary: Poll async generation status of a release note
      operationId: getReleaseNoteGenerateStatus
      description: |
        Returns the current `generation_status` of a release note: `pending`, `running`,
        `completed`, or `failed`. Poll until status is `completed` or `failed`.
      responses:
        "200":
          description: Generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/release-notes/{releaseNoteId}/status:
    parameters:
      - name: releaseNoteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [release-notes]
      summary: Update the workflow status of a release note
      operationId: patchReleaseNoteStatus
      description: |
        Moves a release note through the sign-off workflow: `draft` → `reviewed` → `published`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, reviewed, published]
      responses:
        "200":
          description: Updated release note summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNoteRow"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/diffs/{diffId}/migration-guide:
    parameters:
      - $ref: "#/components/parameters/diffId"
    get:
      tags: [release-notes]
      summary: Get AI-generated per-consumer migration guide for a diff
      operationId: getMigrationGuide
      description: |
        Returns the stored migration guide for this diff (generated by `radar explain
        --migration-guide`). Returns 404 if no guide has been generated yet.
      responses:
        "200":
          description: Migration guide Markdown text
          content:
            application/json:
              schema:
                type: object
                properties:
                  diff_id:
                    type: string
                    format: uuid
                  content:
                    type: string
                    description: Markdown migration guide
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/diffs/{diffId}/test-suites:
    parameters:
      - $ref: "#/components/parameters/diffId"
    get:
      tags: [generate-tests]
      summary: List generated test suites associated with a diff
      operationId: listDiffTestSuites
      responses:
        "200":
          description: Array of test suite summaries for the diff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TestSuiteSummary"

  /scalar/version:
    get:
      tags: [scalar]
      summary: Get Scalar bundle version information
      operationId: getScalarVersion
      security: []
      description: |
        Returns the bundled (compiled-in) version, any runtime override version, the active
        version, and whether a newer version is available on npm.
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalarVersionResponse"

  /scalar/update:
    post:
      tags: [scalar]
      summary: Download and apply the latest Scalar bundle
      operationId: postScalarUpdate
      security: []
      description: |
        Fetches the latest `@scalar/api-reference` bundle from jsDelivr and writes it to the
        override path (`<db-dir>/scalar_override.js`). Only available in SQLite mode.
        Returns 422 in PostgreSQL (web/production) mode.
      responses:
        "200":
          description: Update applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScalarVersionResponse"
        "422":
          description: Not available in PostgreSQL mode

  /auth/login:
    get:
      tags: [auth]
      summary: Initiate OIDC login flow
      operationId: oidcLogin
      security: []
      description: Redirects the browser to the OIDC provider's authorization endpoint.
      responses:
        "302":
          description: Redirect to OIDC provider

  /auth/callback:
    get:
      tags: [auth]
      summary: OIDC authorization code callback
      operationId: oidcCallback
      security: []
      description: |
        Exchanges the authorization code for tokens. Issues two Set-Cookie headers:
        `radar_session` (HS256 JWT, HttpOnly, SameSite=Lax, 24h) and clears the
        `oidc_state` cookie. Redirects to `/app/` on success.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to dashboard on success
        "422":
          $ref: "#/components/responses/BadRequest"

  /auth/me:
    get:
      tags: [auth]
      summary: Get the current authenticated user's profile
      operationId: oidcMe
      description: Returns the subject, email, and org claim from the active session.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/logout:
    get:
      tags: [auth]
      summary: Destroy the current session
      operationId: oidcLogout
      responses:
        "200":
          description: Session destroyed
        "302":
          description: Redirect to login page

  /share/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [share]
      summary: Retrieve a shared diff by share token
      operationId: getSharedDiff
      security: []
      description: |
        Returns a diff and its changes using a pre-generated share token. No authentication
        required — share tokens are scoped to a single diff and do not expose org-level data.
      responses:
        "200":
          description: Shared diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    serviceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    diffId:
      name: diffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    webhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    scanId:
      name: scanId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: |
        Invalid request body or parameters. The server returns this as
        HTTP 422 Unprocessable Entity (see `ApiError::BadRequest`), not 400.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [ok, unreachable]
        version:
          type: string

    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        repo_url:
          type: string
        owner_team:
          type: string
        spec_format:
          type: string
          enum: [openapi, graphql, protobuf]
        org_id:
          type: string
          description: Populated from JWT org_id claim on create; empty string for unauthenticated creates.

    CreateServiceRequest:
      type: object
      required: [name, spec_format]
      properties:
        name:
          type: string
          minLength: 1
        repo_url:
          type: string
          default: ""
        owner_team:
          type: string
          default: ""
        spec_format:
          type: string
          enum: [openapi, graphql, protobuf]
          default: openapi

    Consumer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        repo_url:
          type: string
        owner_team:
          type: string
        contact:
          type: string
        org_id:
          type: string

    CreateConsumerRequest:
      type: object
      required: [name, repo_url, owner_team, contact]
      properties:
        name:
          type: string
          minLength: 1
        repo_url:
          type: string
        owner_team:
          type: string
        contact:
          type: string

    CreateDiffRequest:
      type: object
      required: [service_name, repo_url, owner_team, from_git_ref, to_git_ref, spec_format]
      properties:
        service_name:
          type: string
        repo_url:
          type: string
        owner_team:
          type: string
        from_git_ref:
          type: string
        to_git_ref:
          type: string
        pr_url:
          type: string
          nullable: true
        spec_format:
          type: string
          enum: [openapi, graphql, protobuf]
        spec_yaml:
          type: string
          description: Full spec YAML for the head version; stored for Playground use.
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeInput"

    ChangeInput:
      type: object
      required: [path, kind, severity]
      properties:
        path:
          type: string
        kind:
          type: string
          enum:
            - field_removed
            - field_added
            - type_changed
            - required_changed
            - operation_removed
            - operation_added
            - enum_value_removed
            - enum_value_added
            - nullable_removed
            - nullable_added
            - required_field_added
            - optional_request_body_added
            - required_request_body_added
            - request_body_removed
            - request_body_field_removed
            - response_field_removed
            - response_field_added
            - status_code_removed
        severity:
          type: string
          enum: [breaking, non_breaking_risky, safe]
        description:
          type: string
          nullable: true

    DiffSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
        service_name:
          type: string
        from_git_ref:
          type: string
        to_git_ref:
          type: string
        pr_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        breaking_count:
          type: integer
        risky_count:
          type: integer
        safe_count:
          type: integer

    Diff:
      allOf:
        - $ref: "#/components/schemas/DiffSummary"
        - type: object
          properties:
            changes:
              type: array
              items:
                $ref: "#/components/schemas/Change"

    DiffDetail:
      type: object
      properties:
        id:
          type: string
        from_git_ref:
          type: string
        to_git_ref:
          type: string
        pr_url:
          type: string
          nullable: true
        created_at:
          type: string
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"

    Change:
      type: object
      properties:
        path:
          type: string
        kind:
          type: string
        severity:
          type: string
        description:
          type: string
          nullable: true

    BlastRadius:
      type: object
      properties:
        diff_id:
          type: string
        service_id:
          type: string
        lookback_days:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BlastEntry"

    BlastEntry:
      type: object
      properties:
        consumer:
          $ref: "#/components/schemas/Consumer"
        confidence:
          type: string
          enum: [high, medium, low]
        last_seen:
          type: string
          format: date-time
          nullable: true
        has_runtime_usage:
          type: boolean
        has_call_site:
          type: boolean
        evidence:
          type: array
          description: Up to 5 evidence items explaining why this consumer is affected.
          items:
            $ref: "#/components/schemas/EvidenceItem"

    EvidenceItem:
      type: object
      properties:
        kind:
          type: string
          enum: [runtime_usage, call_site]
        operation:
          type: string
        field_path:
          type: string
        recorded_at:
          type: string
          description: Present for kind=runtime_usage
        file_path:
          type: string
          description: Present for kind=call_site
        line_number:
          type: integer
          description: Present for kind=call_site
        last_seen_at:
          type: string
          description: Present for kind=call_site

    ReleaseNoteRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        diff_id:
          type: string
          format: uuid
        from_git_ref:
          type: string
        to_git_ref:
          type: string
        created_at:
          type: string
          format: date-time

    ReleaseNote:
      allOf:
        - $ref: "#/components/schemas/ReleaseNoteRow"
        - type: object
          properties:
            content:
              type: string
              description: Markdown release notes content

    SpecVersionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
        git_ref:
          type: string
        captured_at:
          type: string
          format: date-time
        spec_format:
          type: string

    TestSuiteSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        jira_key:
          type: string
          nullable: true
        jira_summary:
          type: string
          nullable: true
        collection_name:
          type: string
        test_count:
          type: integer
        happy_count:
          type: integer
        negative_count:
          type: integer
        created_at:
          type: string
          format: date-time

    TestSuiteDetail:
      allOf:
        - $ref: "#/components/schemas/TestSuiteSummary"
        - type: object
          properties:
            collection_json:
              type: object
              description: Full Postman Collection v2.1 JSON
            apitesting_yaml:
              type: string
              nullable: true
              description: api-testing YAML suite

    GenerateTestsRequest:
      type: object
      properties:
        jira_key:
          type: string
          description: Fetch ticket content from Jira (requires JIRA_* env vars on server).
        jira_summary:
          type: string
          description: Ticket title (used when jira_key is not provided).
        jira_description:
          type: string
          description: Ticket body (used when jira_key is not provided).
        spec_yaml:
          type: string
          description: OpenAPI spec YAML to generate tests against.
        base_url:
          type: string
          description: Base URL injected into the generated collection.
          default: "http://localhost:8080"

    SandboxEnv:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
        bearer_token:
          type: string
          description: Masked — only the last 4 characters are returned (e.g. ***n123).
        bearer_token_set:
          type: boolean
          description: Whether a bearer token is stored for this environment.
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSandboxEnvRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        base_url:
          type: string
          default: ""
        bearer_token:
          type: string
          default: ""
          description: Stored securely; only the last 4 chars are returned in responses.
        description:
          type: string
          default: ""

    AppSettings:
      type: object
      properties:
        policy_block_on:
          type: string
          enum: [active_consumers, any_break, never]
          default: active_consumers
          description: When to block CI — active_consumers, any_break, or never (warn only).
        policy_lookback_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: Days of usage history used to classify a consumer as active.
        policy_allow_override_with:
          type: string
          nullable: true
          description: GitHub PR label that bypasses blocking (null to disable).
        retention_days:
          type: integer
          minimum: 1
          maximum: 3650
          default: 90
          description: Usage events older than this are purged automatically each hour.

    IntegrationStatus:
      type: object
      properties:
        anthropic:
          type: boolean
        openai:
          type: boolean
        openai_enterprise:
          type: boolean
        github_copilot:
          type: boolean
        jira:
          type: boolean
        github:
          type: boolean
        postman:
          type: boolean

    UsageEvent:
      type: object
      required: [consumer_id, service_id, operation]
      properties:
        consumer_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        operation:
          type: string
          example: "GET /users"
        field_path:
          type: string
          default: ""

    CallSite:
      type: object
      required: [consumer_id, service_id, file_path, line_number, field_path]
      properties:
        consumer_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        operation:
          type: string
          default: ""
          description: May be empty if the scanner could not determine the operation context.
        file_path:
          type: string
        line_number:
          type: integer
        field_path:
          type: string

    Summary:
      type: object
      properties:
        services_count:
          type: integer
        consumers_count:
          type: integer
        breaking_changes_30d:
          type: integer
        consumers_at_risk:
          type: integer

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
          example: ["diff.created"]
        type:
          type: string
          enum: [generic, slack]
          default: generic
        secret:
          type: string
          nullable: true
          description: Full secret returned only on creation; null in subsequent reads.
        secret_hint:
          type: string
          description: First 4 characters followed by ****, e.g. "abcd****".
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateWebhookRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Must be an HTTPS URL resolving to a public IP (SSRF-protected).
        events:
          type: array
          items:
            type: string
          default: ["diff.created"]
        type:
          type: string
          enum: [generic, slack]
          default: generic

    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event:
          type: string
        status:
          type: string
          enum: [pending, delivered, failed]
        attempt:
          type: integer
          description: Number of HTTP attempts made.
        error:
          type: string
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true

    ScheduledScan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        service_id:
          type: string
          format: uuid
        spec_url:
          type: string
          format: uri
        format:
          type: string
          enum: [openapi, graphql, protobuf]
        interval_minutes:
          type: integer
          minimum: 15
        last_run_at:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateScanRequest:
      type: object
      required: [service_id, spec_url]
      properties:
        service_id:
          type: string
          format: uuid
        spec_url:
          type: string
          format: uri
          description: Public HTTPS URL. Private IP ranges are rejected.
        format:
          type: string
          enum: [openapi, graphql, protobuf]
          default: openapi
        interval_minutes:
          type: integer
          minimum: 15
          default: 60

    ScanRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scan_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        spec_url:
          type: string
          format: uri
        status:
          type: string
          enum: [ok, error, no_change]
        error:
          type: string
          nullable: true
        diff_id:
          type: string
          format: uuid
          nullable: true
        last_run_at:
          type: string
          format: date-time

    CompareSpecsRequest:
      type: object
      required: [base_spec, head_spec, spec_format]
      properties:
        base_spec:
          type: string
          description: Full spec body for the base (older) version
        head_spec:
          type: string
          description: Full spec body for the head (newer) version
        spec_format:
          type: string
          enum: [openapi, graphql, protobuf]
          default: openapi
        base_ref:
          type: string
          default: "base"
        head_ref:
          type: string
          default: "head"

    BatchCompareItem:
      type: object
      required: [base_url, head_url]
      properties:
        label:
          type: string
          description: Human-readable label for this pair (echoed in the response)
        service_id:
          type: string
          format: uuid
          description: Optional — enables posting the diff to the API if provided
        format:
          type: string
          enum: [openapi, graphql, protobuf]
          default: openapi
        base_url:
          type: string
          description: URL of the base spec file
        head_url:
          type: string
          description: URL of the head spec file

    BatchResultItem:
      type: object
      properties:
        label:
          type: string
        status:
          type: string
          enum: [ok, breaking, error]
        diff_id:
          type: string
          format: uuid
          nullable: true
        breaking_count:
          type: integer
        changes_count:
          type: integer
        error:
          type: string
          nullable: true

    UpsertConsumerRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        catalog_source:
          type: string
          default: "collection_file"
          description: Label identifying what registered this consumer (e.g. "collection_file", "backstage")

    CollectionEvidenceItem:
      type: object
      required: [consumer_id, service_id]
      properties:
        consumer_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        operation:
          type: string
          default: ""
          description: API operation string e.g. "GET /users"
        field_path:
          type: string
          default: ""
          description: Dot-separated field path accessed by this call
        evidence_uri:
          type: string
          default: ""
          description: Source URI of the collection file for traceability

    EvidenceCoverageEntry:
      description: |
        Flat row from the evidence coverage query. One row per (consumer × service × source_type)
        combination. The UI groups by service_id to build the nested view.
      type: object
      properties:
        consumer_id:
          type: string
          format: uuid
        consumer_name:
          type: string
        service_id:
          type: string
          format: uuid
        service_name:
          type: string
        source_type:
          type: string
          enum: [runtime_usage, static_call_site, collection_file]
        event_count:
          type: integer
          description: Total evidence items of this source_type for this (consumer, service) pair
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        is_stale:
          type: boolean
          description: True when no evidence was recorded in the last 7 days

    SamplingConfig:
      type: object
      properties:
        sample_rate:
          type: number
          format: double
          minimum: 0.0
          maximum: 1.0
          default: 1.0
          description: Fraction of incoming usage events to store (1.0 = store all)
        field_deny_list:
          type: array
          items:
            type: string
          default: []
          description: Field paths to exclude from evidence ingestion (e.g. "password", "ssn")

    PolicyDecision:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        diff_id:
          type: string
          format: uuid
          nullable: true
        service_id:
          type: string
          format: uuid
          nullable: true
        verdict:
          type: string
          description: Outcome of the policy check (e.g. "pass", "fail", "warn")
        fail_mode:
          type: string
          description: Policy mode in effect (e.g. "active_consumers", "any_break", "never")
        actor:
          type: string
          nullable: true
          description: CI actor or user who triggered the check
        created_at:
          type: string
          format: date-time

    PolicyDecisionListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDecision"
        limit:
          type: integer
        offset:
          type: integer

    CreatePolicyDecisionRequest:
      type: object
      required: [verdict, fail_mode]
      properties:
        diff_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        verdict:
          type: string
          description: "Pass/fail/warn outcome from the policy evaluation"
        fail_mode:
          type: string
          description: "Policy block_on setting in effect: active_consumers | any_break | never"
        actor:
          type: string
          description: CI actor identifier (e.g. GitHub Actions runner, username)

    Acknowledgement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        diff_id:
          type: string
          format: uuid
          nullable: true
        change_id:
          type: string
          format: uuid
          nullable: true
        consumer_id:
          type: string
          format: uuid
          nullable: true
        service_id:
          type: string
          format: uuid
          nullable: true
        acknowledged_by:
          type: string
        reason:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateAcknowledgementRequest:
      type: object
      required: [acknowledged_by]
      properties:
        diff_id:
          type: string
          format: uuid
        change_id:
          type: string
          format: uuid
        consumer_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        acknowledged_by:
          type: string
          minLength: 1
        reason:
          type: string
        expires_at:
          type: string
          format: date-time

    CatalogSource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
          nullable: true
        kind:
          type: string
        token_env:
          type: string
          nullable: true
          description: Name of the environment variable holding the auth token for this catalog
        sync_interval_secs:
          type: integer
          nullable: true
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateCatalogSourceRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
        kind:
          type: string
        url:
          type: string
          format: uri
        token_env:
          type: string
          description: Name of an env var on the server holding the auth token for this catalog
        sync_interval_secs:
          type: integer
          minimum: 60

    EvolutionRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        change_kind:
          type: string
          description: The change kind this rule targets (e.g. field_removed)
        path_pattern:
          type: string
          nullable: true
          description: Optional dot-separated field path glob (e.g. "users.*", "**.legacy_field")
        severity_override:
          type: string
          enum: [safe, non_breaking_risky]
          description: Downgrade matched changes to this severity instead of blocking
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    CreateEvolutionRuleRequest:
      type: object
      required: [name, change_kind, severity_override]
      properties:
        name:
          type: string
          minLength: 1
          description: Human-readable label for this rule
        change_kind:
          type: string
          description: ChangeKind to target (e.g. field_added, enum_value_added)
        path_pattern:
          type: string
          description: Optional dot-separated field path glob
        severity_override:
          type: string
          enum: [safe, non_breaking_risky]

    CsvRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending, running, completed, completed_with_failures, failed, cancelled]
        total_rows:
          type: integer
        completed_rows:
          type: integer
        error_count:
          type: integer
        error_message:
          type: string
          nullable: true
          description: Top-level error if the entire job failed (not per-row errors)
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    RequestTemplate:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: URL template. Use {{column_name}} placeholders for per-row substitution.
          example: "https://api.example.com/users/{{id}}"
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          default: GET
        headers:
          type: array
          items:
            $ref: "#/components/schemas/HeaderPair"
          default: []
        body:
          type: string
          default: ""
          description: Request body template. May use {{column_name}} placeholders.
        capture_body:
          type: boolean
          default: false
          description: Store up to 10 KB of each response body alongside the result.
        enable_retry:
          type: boolean
          default: false
          description: |
            Retry rows on 5xx / network errors (up to 3 attempts: 0s, 1s, 4s backoff).
            GET and HEAD always get the full retry budget regardless of this flag.

    HeaderPair:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
          description: May use {{column_name}} placeholders.

    CreateCsvRunRequest:
      type: object
      required: [request, rows]
      properties:
        name:
          type: string
          default: ""
          description: Optional human-readable label for this run
        request:
          $ref: "#/components/schemas/RequestTemplate"
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: |
            Pre-parsed CSV rows as JSON objects. Keys are column headers; values are the
            cell strings. Maximum 500 rows per request.

    CsvRunResult:
      type: object
      properties:
        row_number:
          type: integer
        http_status:
          type: integer
          nullable: true
        duration_ms:
          type: integer
        error:
          type: string
          nullable: true
        url:
          type: string
          description: The resolved URL that was called for this row
        response_body:
          type: string
          nullable: true
          description: First 10 KB of response body, present only when capture_body was true.
        row_data:
          type: string
          description: Serialised JSON of the original input row

    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
        actor:
          type: string
          description: JWT sub or static token identifier
        action:
          type: string
          example: "diff.created"
        entity_type:
          type: string
          example: "diff"
          nullable: true
        entity_id:
          type: string
          format: uuid
          nullable: true
        meta:
          type: object
          description: Arbitrary key-value context. Secret values are automatically redacted.
        created_at:
          type: string
          format: date-time

    CreateAuditEventRequest:
      type: object
      required: [actor, action]
      properties:
        actor:
          type: string
          description: Identifier of the actor recording the event
        action:
          type: string
          example: "ci.check.triggered"
        entity_type:
          type: string
        entity_id:
          type: string
        meta:
          type: object

    ReadinessItem:
      type: object
      properties:
        name:
          type: string
          description: Item identifier (e.g. "services", "consumers", "diffs", "ai_provider")
        status:
          type: string
          enum: [ok, missing, warn]
        hint:
          type: string
          description: Human-readable guidance shown when status is not ok
        count:
          type: integer
        last_at:
          type: string
          format: date-time
          nullable: true

    ReadinessResponse:
      type: object
      properties:
        overall:
          type: string
          enum: [ready, setup_required]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessItem"

    GenerateStatusResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        generation_status:
          type: string
          enum: [pending, running, completed, failed]
        generation_error:
          type: string
          nullable: true

    ScalarVersionResponse:
      type: object
      properties:
        bundled:
          type: string
          description: Version compiled into the binary
        override:
          type: string
          nullable: true
          description: Version stored as a runtime override, or null
        active:
          type: string
          description: Currently-served version (override if present, otherwise bundled)
        latest:
          type: string
          nullable: true
          description: Latest version available on npm, or null if the check failed
        update_available:
          type: boolean

    AuthUser:
      type: object
      properties:
        sub:
          type: string
          description: Subject identifier from the OIDC provider
        email:
          type: string
          format: email
        org_id:
          type: string
          description: Extracted from the claim named by RADAR_OIDC_ORG_CLAIM

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
