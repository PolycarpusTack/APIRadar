[workspace]
members = ["radar-core", "radar-cli", "radar-api", "radar-scanner"]
resolver = "2"

[profile.release]
opt-level    = 3       # maximum speed
lto          = "thin"  # link-time optimisation (smaller binary, faster startup)
codegen-units = 1      # single codegen unit for better inlining
strip        = "symbols"  # remove debug symbols → ~60% smaller binary on Linux/Mac
# NOTE: `panic = "abort"` was removed deliberately (F-07). It is a reasonable
# trade for a CLI, but radar-api is a long-running server: with `abort`, a
# panic in ONE request terminates the whole process, and no catch-panic layer
# can intervene because there is no unwinding to catch. Unwinding costs some
# binary size and buys per-request fault isolation.

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
# TLS: rustls, not native-tls. `tls-rustls-ring-native-roots` (rather than the
# `runtime-tokio-rustls` shorthand, which selects webpki roots) keeps trust
# anchored in the OS certificate store — the same behaviour native-tls had, so
# a Postgres server presenting a private/internal CA still verifies.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring-native-roots", "sqlite", "postgres", "uuid", "chrono", "macros", "any"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "timeout", "catch-panic"] }
openapiv3 = "2"
serde_yml = "0.0.13"
indexmap = { version = "2", features = ["serde"] }
colored = "3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tower = "0.5"
jsonwebtoken = "9"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
clap_complete = "4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
