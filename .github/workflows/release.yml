name: Release

# Triggered when a version tag (v*) is pushed.
# Builds radar-api release binary, radar-ui static bundle, and Electron installers,
# then creates a GitHub Release with the artifacts attached.

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Build radar-api release binary
  # ---------------------------------------------------------------------------
  build-api:
    name: Build API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: radar-api-linux-x64
            binary: target/release/radar-api
          - os: windows-latest
            artifact: radar-api-windows-x64
            binary: target/release/radar-api.exe

    env:
      DATABASE_URL: sqlite:ci-release.db

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create release database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Build release binary
        run: cargo build --release -p radar-api

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  # ---------------------------------------------------------------------------
  # Build radar-ui static bundle and Electron installer (Windows)
  # ---------------------------------------------------------------------------
  build-desktop:
    name: Build Desktop (Windows)
    runs-on: windows-latest

    env:
      DATABASE_URL: sqlite:ci-release.db

    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI bundle
        run: pnpm build:ui

      - name: Install Rust stable (for sidecar)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create release database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Build API sidecar
        run: cargo build --release -p radar-api

      - name: Build Electron main/preload bundles
        working-directory: radar-desktop
        run: pnpm run build

      - name: Build Electron installer
        working-directory: radar-desktop
        run: pnpm run dist -- --win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-desktop-windows-installer
          path: radar-desktop/dist/*.exe

  # ---------------------------------------------------------------------------
  # Create GitHub Release and attach all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-api, build-desktop]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: API Contract Radar ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*
