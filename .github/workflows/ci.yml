name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust: fmt, clippy, test, audit, release build
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:ci-test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create CI database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      # D-11 / F-16: security audit — ADVISORY here, blocking in the nightly
      # security-audit workflow.
      #
      # `cargo audit` checks Cargo.lock against the live RustSec advisory
      # database, so its result depends on when it runs, not on what the PR
      # changed. A new advisory published against any of ~395 transitive
      # dependencies would otherwise red-light every open PR, blaming authors
      # for something outside their change. Nightly still fails loudly, so the
      # debt surfaces within a day.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit (advisory)
        continue-on-error: true
        run: cargo audit

      - name: Build release binary (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --release

      # D-11: generate SBOM for release binaries
      - name: Install cargo-cyclonedx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # cargo-cyclonedx writes <crate>.cdx.json per package with --format json;
        # the removed --output-cdx flag is not accepted by current versions.
        run: cargo cyclonedx --format json

      - name: Upload SBOM artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # F-39: prove TLS to PostgreSQL actually works, and actually verifies.
  #
  # The plain `rust-postgres` job connects without TLS, so nothing exercised the
  # TLS path when sqlx moved from native-tls to rustls. This job connects with
  # sslmode=verify-full against a Postgres presenting a certificate signed by a
  # CA installed in the SYSTEM trust store — which is precisely the behaviour
  # `tls-rustls-ring-native-roots` was chosen to preserve. If someone later
  # switches to the `runtime-tokio-rustls` shorthand (webpki roots), this job
  # goes red instead of the failure surfacing in production.
  rust-postgres-tls:
    name: Rust (Postgres over TLS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Issue a CA and a server certificate for localhost
        run: |
          set -euo pipefail
          mkdir -p /tmp/pgtls
          cd /tmp/pgtls
          # Root CA
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ca.key -out ca.crt -subj "/CN=radar-test-ca"
          # A second, unrelated CA: the negative test points verify-full at
          # this and must be refused. Using a real-but-wrong CA keeps the
          # expected outcome identical here and on a developer machine.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout other-ca.key -out other-ca.crt -subj "/CN=unrelated-ca"
          # Server cert signed by that CA, with a SAN for localhost
          openssl req -newkey rsa:2048 -nodes \
            -keyout server.key -out server.csr -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\n" > san.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -out server.crt -days 1 -extfile san.ext
          # Postgres refuses to start if the key is group/world readable.
          sudo chmod 600 server.key
          sudo chown 999:999 server.key server.crt

      - name: Trust the CA system-wide
        run: |
          set -euo pipefail
          sudo cp /tmp/pgtls/ca.crt /usr/local/share/ca-certificates/radar-test-ca.crt
          sudo update-ca-certificates
          # This is the load-bearing bit: verify-full below must succeed ONLY
          # because the CA is in the OS store, not because verification is off.

      - name: Start PostgreSQL with TLS enabled
        run: |
          set -euo pipefail
          docker run -d --name pg-tls \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=radar_test \
            -p 5432:5432 \
            -v /tmp/pgtls:/certs:ro \
            postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/certs/server.crt \
            -c ssl_key_file=/certs/server.key
          for i in $(seq 1 30); do
            if docker exec pg-tls pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done
          docker exec pg-tls psql -U postgres -c "SHOW ssl;" | grep -q on

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Run migrations over TLS
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost/radar_test?sslmode=verify-full
        run: sqlx migrate run --source radar-api/migrations

      - name: Connect from sqlx over TLS and assert the session is encrypted
        env:
          RADAR_TEST_PG_TLS_URL: postgres://postgres:postgres@localhost/radar_test?sslmode=verify-full
          RADAR_TEST_PG_TLS_BAD_CA: /tmp/pgtls/other-ca.crt
        run: cargo test -p radar-api --test postgres_tls -- --nocapture

      - name: Tear down
        if: always()
        run: docker rm -f pg-tls || true

  # Rust (Postgres): gate migrations AND the full query layer on a real Postgres
  # 16 instance (portability regression guard).
  #
  # RE-ENABLED (N-26): this job previously ran migrations only, because the sqlx
  # Any driver does not translate `?` placeholders to `$N` for Postgres (42601
  # syntax errors). N-26 fixes that at the query layer (radar-api/src/db.rs: the
  # `pg()` rewrite + q!/qs!/qa! macros rewrite `?`→`$N` when the pool is Postgres).
  # The full `cargo test --all` now runs against Postgres as a GATING check, so a
  # placeholder-portability regression turns CI red instead of silently passing.
  rust-postgres:
    name: Rust (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/radar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create CI database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Run tests against Postgres
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # Node: lint, build UI
  # ---------------------------------------------------------------------------
  node:
    name: Node / pnpm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.30.3 --activate

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      # N-32: JS supply-chain scan. Advisory (non-gating): `|| true` keeps the
      # job green so a transitive low/moderate advisory with no available fix
      # doesn't block unrelated PRs. Dependabot (.github/dependabot.yml) opens
      # the actual upgrade PRs. Tighten to gating (drop `|| true`) once the tree
      # is clean at --audit-level=high.
      - name: JS dependency audit (advisory)
        run: pnpm audit --audit-level=high || true

      - name: Lint workspaces
        run: pnpm --recursive lint

      - name: Type-check UI
        run: pnpm --filter radar-ui typecheck

      # N-31: type-check the desktop main/preload process (untrusted Node
      # boundary) so it's covered on every push, not only at a release tag.
      - name: Type-check desktop
        run: pnpm --filter radar-desktop typecheck

      - name: Unit tests (Vitest)
        run: pnpm --filter radar-ui test

      - name: Build UI
        run: pnpm build:ui

      # N-31: compile the desktop bundle (electron-vite build) unsigned — no
      # electron-builder packaging or signing certs required. Catches renderer/
      # main build breaks that were previously only found at release time.
      - name: Build desktop (unsigned, no packaging)
        run: pnpm --filter radar-desktop build
        # Note: electron-builder packaging/signing (`pnpm dist`) is still skipped
        # in CI — it requires signing certs.

      # D-8: Playwright E2E smoke tests (UI only, no API required)
      - name: Install Playwright browsers
        run: pnpm --filter radar-ui exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm --filter radar-ui test:e2e
        env:
          CI: true

  # ---------------------------------------------------------------------------
  # Coverage: measure line coverage, enforce minimum threshold, upload report
  # Run on every PR + push to main so regressions are caught before merge.
  # Threshold starts at 50% (conservative baseline); raise to 70% once the
  # team has reviewed the first HTML report and back-filled gaps.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: rust
    # Enforced gate: the first green run confirmed line coverage is >= 65%.

    env:
      DATABASE_URL: sqlite:ci-test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create CI database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          # Collect coverage once, then emit each report format separately:
          # current cargo-llvm-cov forbids --lcov and --html in one invocation.
          IGNORE='(benches|/\.cargo/)'
          cargo llvm-cov --workspace --no-report --ignore-filename-regex "$IGNORE"
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$IGNORE"
          cargo llvm-cov report --html --output-dir coverage-html --ignore-filename-regex "$IGNORE"
          cargo llvm-cov report --fail-under-lines 65 --ignore-filename-regex "$IGNORE"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-html/

      - name: Print coverage summary
        if: always()
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex '(benches|/\.cargo/)' \
            --summary-only 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # OpenAPI: validate docs/openapi.yaml against the OpenAPI 3.x meta-schema.
  # Catches broken $refs, missing required fields, and schema type errors
  # before they silently diverge from the implementation.
  # ---------------------------------------------------------------------------
  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator==0.7.1

      - name: Validate OpenAPI spec
        run: python -m openapi_spec_validator docs/openapi.yaml

  # ---------------------------------------------------------------------------
  # Docker: build radar-api image (push to main only)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build radar-api image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: radar-api/Dockerfile
          push: false
          tags: radar-api:ci
