name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust: fmt, clippy, test, release build
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:ci-test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create CI database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source drift-api/migrations

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Build release binary (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --release

  # ---------------------------------------------------------------------------
  # Node: lint, build UI
  # ---------------------------------------------------------------------------
  node:
    name: Node / pnpm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Lint workspaces
        run: pnpm --recursive lint

      - name: Build UI
        run: pnpm build:ui
        # Note: Electron/desktop build is skipped in CI — requires signing certs.

  # ---------------------------------------------------------------------------
  # Docker: build drift-api image (push to main only)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build drift-api image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: drift-api:ci
