name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust: fmt, clippy, test, audit, release build
  # ---------------------------------------------------------------------------
  rust:
    name: Rust
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:ci-test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create CI database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      # D-11: security audit — fails CI on known vulnerabilities
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

      - name: Build release binary (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo build --release

      # D-11: generate SBOM for release binaries
      - name: Install cargo-cyclonedx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo cyclonedx --format json --output-cdx

      - name: Upload SBOM artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*.cdx.json"

  # ---------------------------------------------------------------------------
  # Rust (Postgres): run tests against a real Postgres 16 instance
  # ---------------------------------------------------------------------------
  rust-postgres:
    name: Rust (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radar_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/radar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create CI database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Run tests
        run: cargo test --all

  # ---------------------------------------------------------------------------
  # Node: lint, build UI
  # ---------------------------------------------------------------------------
  node:
    name: Node / pnpm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable pnpm via Corepack
        run: corepack enable && corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Lint workspaces
        run: pnpm --recursive lint

      - name: Type-check UI
        run: pnpm --filter radar-ui typecheck

      - name: Unit tests (Vitest)
        run: pnpm --filter radar-ui test

      - name: Build UI
        run: pnpm build:ui
        # Note: Electron/desktop build is skipped in CI — requires signing certs.

      # D-8: Playwright E2E smoke tests (UI only, no API required)
      - name: Install Playwright browsers
        run: pnpm --filter radar-ui exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm --filter radar-ui test:e2e
        env:
          CI: true

  # ---------------------------------------------------------------------------
  # Coverage: measure line coverage, enforce minimum threshold, upload report
  # Run on every PR + push to main so regressions are caught before merge.
  # Threshold starts at 50% (conservative baseline); raise to 70% once the
  # team has reviewed the first HTML report and back-filled gaps.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: rust

    env:
      DATABASE_URL: sqlite:ci-test.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features sqlite,postgres

      - name: Create CI database and run migrations
        run: |
          sqlx database create
          sqlx migrate run --source radar-api/migrations

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: |
          cargo llvm-cov \
            --workspace \
            --lcov --output-path lcov.info \
            --html --output-dir coverage-html \
            --ignore-filename-regex '(benches|/\.cargo/)' \
            --fail-under-lines 65

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-html/

      - name: Print coverage summary
        if: always()
        run: |
          cargo llvm-cov report \
            --ignore-filename-regex '(benches|/\.cargo/)' \
            --summary-only 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # OpenAPI: validate docs/openapi.yaml against the OpenAPI 3.x meta-schema.
  # Catches broken $refs, missing required fields, and schema type errors
  # before they silently diverge from the implementation.
  # ---------------------------------------------------------------------------
  openapi:
    name: OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install openapi-spec-validator
        run: pip install openapi-spec-validator==0.7.1

      - name: Validate OpenAPI spec
        run: python -m openapi_spec_validator docs/openapi.yaml

  # ---------------------------------------------------------------------------
  # Docker: build radar-api image (push to main only)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build radar-api image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: radar-api/Dockerfile
          push: false
          tags: radar-api:ci
