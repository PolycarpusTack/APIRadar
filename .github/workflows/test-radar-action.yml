name: Test radar-action

on:
  push:
    branches: [main]
    paths:
      - 'radar-action/**'
      - 'radar-cli/**'
      - 'radar-core/**'
  pull_request:
    branches: [main]
    paths:
      - 'radar-action/**'
      - 'radar-cli/**'
      - 'radar-core/**'

jobs:
  # ---------------------------------------------------------------------------
  # Smoke test: identical specs → step succeeds, breaking-count=0, verdict=pass
  # ---------------------------------------------------------------------------
  test-clean:
    name: radar-action (clean — no breaking changes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No continue-on-error: a non-zero exit here is a real failure.
      - name: Run radar-action against identical specs
        id: radar
        uses: ./radar-action
        with:
          base-spec: fixtures/demo-payments-api/v1.yaml
          head-spec: fixtures/demo-payments-api/v1.yaml
          spec-format: openapi

      - name: Assert clean outputs
        shell: bash
        env:
          BREAKING_COUNT: ${{ steps.radar.outputs.breaking-count }}
          POLICY_VERDICT: ${{ steps.radar.outputs.policy-verdict }}
        run: |
          echo "breaking-count=$BREAKING_COUNT"
          echo "policy-verdict=$POLICY_VERDICT"
          [ "$BREAKING_COUNT" = "0" ] || { echo "Expected breaking-count=0"; exit 1; }
          [ "$POLICY_VERDICT" = "pass" ] || { echo "Expected policy-verdict=pass"; exit 1; }

  # ---------------------------------------------------------------------------
  # Smoke test: v1→v2 (phone field removed) → Breaking Changes detected.
  # fail-mode: warn makes the action exit 0 legitimately (the workspace has no
  # .radar.yml, so the input applies), letting us assert the outputs afterwards.
  # ---------------------------------------------------------------------------
  test-breaking:
    name: radar-action (breaking — phone field removed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run radar-action against v1→v2 specs
        id: radar
        uses: ./radar-action
        with:
          base-spec: fixtures/demo-payments-api/v1.yaml
          head-spec: fixtures/demo-payments-api/v2.yaml
          spec-format: openapi
          fail-mode: warn

      - name: Assert breaking outputs
        shell: bash
        env:
          BREAKING_COUNT: ${{ steps.radar.outputs.breaking-count }}
          POLICY_VERDICT: ${{ steps.radar.outputs.policy-verdict }}
        run: |
          echo "breaking-count=$BREAKING_COUNT"
          echo "policy-verdict=$POLICY_VERDICT"
          case "$BREAKING_COUNT" in
            ''|*[!0-9]*) echo "Expected a numeric breaking-count, got '$BREAKING_COUNT'"; exit 1 ;;
          esac
          [ "$BREAKING_COUNT" -gt 0 ] || { echo "Expected at least one breaking change"; exit 1; }
          [ "$POLICY_VERDICT" = "warn" ] || { echo "Expected policy-verdict=warn under fail-mode: warn"; exit 1; }

  # ---------------------------------------------------------------------------
  # Smoke test: GraphQL SDL diff → Breaking Change detected (fail-mode: warn
  # keeps the step's exit code 0 so the assert step runs).
  # ---------------------------------------------------------------------------
  test-graphql:
    name: radar-action (GraphQL — type field removed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write base SDL
        shell: bash
        run: |
          cat > /tmp/base.graphql <<'EOF'
          type User { id: ID! name: String! phone: String }
          type Query { user(id: ID!): User }
          EOF

      - name: Write head SDL (phone removed)
        shell: bash
        run: |
          cat > /tmp/head.graphql <<'EOF'
          type User { id: ID! name: String! }
          type Query { user(id: ID!): User }
          EOF

      - name: Run radar-action on GraphQL specs
        id: radar
        uses: ./radar-action
        with:
          base-spec: /tmp/base.graphql
          head-spec: /tmp/head.graphql
          spec-format: graphql
          fail-mode: warn

      - name: Assert GraphQL breaking change detected
        shell: bash
        env:
          BREAKING_COUNT: ${{ steps.radar.outputs.breaking-count }}
          POLICY_VERDICT: ${{ steps.radar.outputs.policy-verdict }}
        run: |
          echo "breaking-count=$BREAKING_COUNT"
          echo "policy-verdict=$POLICY_VERDICT"
          case "$BREAKING_COUNT" in
            ''|*[!0-9]*) echo "Expected a numeric breaking-count, got '$BREAKING_COUNT'"; exit 1 ;;
          esac
          [ "$BREAKING_COUNT" -gt 0 ] || { echo "Expected breaking change in GraphQL diff"; exit 1; }
          [ "$POLICY_VERDICT" = "warn" ] || { echo "Expected policy-verdict=warn under fail-mode: warn"; exit 1; }
