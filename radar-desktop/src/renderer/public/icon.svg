<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-g" x1="0" y1="512" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A0A6B"/>
      <stop offset="1" stop-color="#4515F0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-g)"/>

  <!-- Crosshairs -->
  <line x1="112" y1="256" x2="400" y2="256" stroke="white" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="256" y1="112" x2="256" y2="400" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Concentric dashed rings -->
  <circle cx="256" cy="256" r="88"  stroke="white" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="6 10"/>
  <circle cx="256" cy="256" r="148" stroke="white" stroke-opacity="0.09" stroke-width="1.5" stroke-dasharray="6 10"/>

  <!-- Sweep group — origin at icon centre (256,256) -->
  <!-- Angle 300° (SVG clockwise from east = 1 o'clock):
       cos(300°)=0.5, sin(300°)=−0.866
       tip at r=148: x=74, y=−128.1 -->
  <g transform="translate(256,256)">
    <!-- Trailing sector: 270°→300° (12→1 o'clock) -->
    <path d="M 0 0 L 0 -148 A 148 148 0 0 1 74 -128.1 Z" fill="#5B33F0" fill-opacity="0.18"/>

    <!-- Sweep arm -->
    <line x1="0" y1="0" x2="74" y2="-128.1"
          stroke="white" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Centre anchor dot -->
    <circle cx="0" cy="0" r="5" fill="white" fill-opacity="0.45"/>

    <!-- Neon ping at sweep tip -->
    <circle cx="74" cy="-128.1" r="26" fill="#B3FC4F" fill-opacity="0.18"/>
    <circle cx="74" cy="-128.1" r="17" fill="#B3FC4F" fill-opacity="0.72"/>
    <circle cx="74" cy="-128.1" r="9"  fill="#EEFFAA"/>
  </g>
</svg>
